tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a new contact'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - phone
        properties:
          name:
            description: 'Contact name'
            type: string
            example: 'John Doe'
          email:
            description: 'Contact email'
            type: string
            format: email
            example: 'john.doe@example.com'
          phone:
            description: 'Contact phone number'
            type: string
            example: '+380991234567'
          favorite:
            description: 'Whether contact is favorite'
            type: boolean
            example: false
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '400':
    description: Bad Request
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Validation error
