tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: 'Retrieve a list of contacts with pagination options'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: userId
    schema:
      type: string
    example: '65e4decdd286b30065d54af9'
    description: 'User ID to filter contacts'
  - in: query
    name: page
    schema:
      type: integer
    example: 1
    description: 'Page number'
    required: false
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
    description: 'Number of contacts per page'
    required: false
  - in: query
    name: sortBy
    schema:
      type: string
      example: '_id'
    description: 'Field to sort by'
    required: false
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
    description: 'Sort order'
    required: false
  - in: query
    name: filter[isFavourite]
    schema:
      type: boolean
      example: true
    description: 'Filter contacts by favourite status'
    required: false
responses:
  '200':
    description: Successfully retrieved contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 14
                totalPages:
                  type: number
                  example: 4
  '401':
    $ref: '../../components/responses/401.yaml'
